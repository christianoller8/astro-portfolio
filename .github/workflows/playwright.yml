name: Playwright Tests
# Pruebas de extremo a extremo (tests/) sobre la web construida: el config de Playwright hace
# `pnpm build` y `pnpm preview` en el puerto 4400 y las pruebas recorren ese servidor, nunca la web en
# vivo. Corren en cada push a main y a prototipo-def y a mano (sin pull_request: duplicaba cada ejecución). Solo Chromium:
# escritorio (1440 × 900) y móvil (390 px). El informe HTML se sube siempre que el trabajo no se cancele.
on:
  push:
    branches: [main, prototipo-def]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium
    - name: Run Playwright tests
      run: pnpm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
